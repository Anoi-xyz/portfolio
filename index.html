<style>
:root{--bg:#08090a;--glass:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--text:#f2f3f4;--dim:#8b9096;--green:#3ddc84;--gsoft:rgba(61,220,132,.13);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,rgba(255,255,255,.09),transparent 60%),radial-gradient(700px 500px at -10% 40%,rgba(61,220,132,.06),transparent 60%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:10px auto 0;max-width:720px;display:flex;align-items:center;gap:8px;padding:6px;border-radius:999px;background:rgba(20,21,23,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.logo{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#7d8288);color:#0a0a0a;font-weight:800;font-size:15px}
.tabs{flex:1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;color:var(--dim);font:500 13px Inter,system-ui,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button.act{background:#f2f3f4;color:#0a0a0a}
.hire{flex:none;background:var(--gsoft);color:var(--green);border:1px solid rgba(61,220,132,.3);font-weight:600;font-size:13px;padding:7px 13px;border-radius:999px}
section{display:none;padding-top:22px}
section.on{display:block}
h1{font-size:clamp(40px,12vw,64px);line-height:1.02;letter-spacing:-.035em;margin:0 0 14px;font-weight:800}
h1 span{display:block;color:#6d7177}
h2{font-size:26px;letter-spacing:-.025em;margin:0 0 4px}
h3{font-size:17px;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--dim);margin:0 0 20px;max-width:46ch}
p{margin:0 0 12px}
.dim{color:var(--dim);font-size:14px}
.hero{position:relative;padding:12px 0 6px;overflow:hidden}
.orb{flex:none;width:112px;height:112px;border-radius:50%;object-fit:cover;border:1px solid var(--line);box-shadow:0 0 50px rgba(255,214,10,.16)}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.mini{flex:1;padding:12px 14px;border-radius:16px;background:rgba(30,32,35,.8);border:1px solid var(--line);backdrop-filter:blur(8px)}
.mini b{display:block;font-size:20px}
.mini .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--glass)}
.btn.main{background:linear-gradient(#fff,#cfd2d6);color:#0a0a0a;border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;backdrop-filter:blur(6px)}
.stats .card{margin:0;padding:14px 12px}
.stats b{display:block;font-size:24px;letter-spacing:-.03em}
.stats span{font-size:12px;color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:#c9ccd0}
.tag.g{background:var(--gsoft);color:var(--green)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin-bottom:8px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-weight:500;font-size:15px}
.row i{font-style:normal;color:var(--green);font-size:17px;line-height:1}
.row:hover,.links a:hover,.btn:hover{border-color:rgba(255,255,255,.22)}
.shot{display:block;width:100%;border-radius:12px;border:1px solid var(--line);margin-top:6px}
footer{margin-top:26px;padding:18px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
footer .links{margin-top:10px}
</style>

}
